<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Timetable — UniMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="hamburger"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div><div class="topbar-title">Weekly Timetable</div><div class="breadcrumb" id="tt-subtitle">Your lecture schedule</div></div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openAddLecture()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Class</button>
            </div>
        </header>
        <main class="page-body">
            <div class="card"><div class="tt-scroll"><div class="tt-grid" id="tt-grid"></div></div></div>
        </main>
    </div>
</div>

<!-- Add/Edit Class -->
<div class="modal-overlay" id="modal-lecture">
    <div class="modal">
        <div class="modal-header"><h3 class="modal-title" id="lecture-modal-title">Add Class</h3><button class="modal-close" onclick="closeModal('modal-lecture')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
        <div class="alert-box alert-error" id="lecture-error"></div>
        <div class="form-group"><label class="form-label" for="l-course">Course *</label><select class="form-control" id="l-course"><option value="">— Select a course —</option></select><div class="form-error" id="err-l-course">Please select a course.</div></div>
        <div class="form-group"><label class="form-label" for="l-day">Day *</label><select class="form-control" id="l-day">
            <option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option>
            <option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option>
        </select></div>
        <div class="form-row">
            <div class="form-group"><label class="form-label" for="l-start">Starts *</label><input class="form-control" type="time" id="l-start" step="300"/><div class="form-error" id="err-l-start">Required.</div></div>
            <div class="form-group"><label class="form-label" for="l-end">Ends *</label><input class="form-control" type="time" id="l-end" step="300"/><div class="form-error" id="err-l-end">Required.</div></div>
        </div>
        <div class="form-group"><label class="form-label" for="l-room">Room (optional)</label><input class="form-control" id="l-room" placeholder="e.g. B204" maxlength="60"/></div>
        <input type="hidden" id="l-edit-id"/>
        <div class="modal-footer">
            <button class="btn btn-ghost text-danger hidden" id="l-delete-btn" onclick="deleteLecture()">Remove</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-lecture')">Cancel</button>
            <button class="btn btn-primary" onclick="saveLecture()">Save</button>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/js/app.js"></script>
<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/timetable.js"></script>
</body>
</html>
